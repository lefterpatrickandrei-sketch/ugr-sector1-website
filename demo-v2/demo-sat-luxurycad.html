<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEMO 2C — Dark CAD Luxury (Click Direct pe Buline)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#02050b; overflow:hidden; height:100vh; font-family:'IBM Plex Mono', 'Segoe UI', monospace; }
  #c { display:block; position:fixed; inset:0; cursor:grab; }
  #c:active { cursor:grabbing; }

  #tooltip {
    position:fixed; pointer-events:none; z-index:100; display:none;
    background:rgba(2,5,11,0.85); backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.3); border-radius:6px;
    padding:4px 8px; font-size:10px; color:#ffffff; letter-spacing:0.08em;
    transform:translate(-50%, -130%); white-space:nowrap;
    box-shadow:0 4px 16px rgba(0,0,0,0.6);
  }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="tooltip"></div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
const canvas = document.getElementById('c');
const tooltip = document.getElementById('tooltip');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x02050b);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.01, 100);
camera.position.set(0, 0.35, 2.75);

const globeGroup = new THREE.Group();
scene.add(globeGroup);

// Texture globe
const tex = new THREE.TextureLoader().load('https://unpkg.com/three-globe/example/img/earth-dark.jpg');
const globeMesh = new THREE.Mesh(
  new THREE.SphereGeometry(1, 72, 72),
  new THREE.MeshPhongMaterial({ map: tex, shininess: 8, specular: new THREE.Color(0x111e2e) })
);
globeGroup.add(globeMesh);

// Atmosphere
globeGroup.add(new THREE.Mesh(
  new THREE.SphereGeometry(1.030, 32, 32),
  new THREE.ShaderMaterial({
    vertexShader:`varying vec3 vN;void main(){vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`varying vec3 vN;void main(){float i=pow(.68-dot(vN,vec3(0,0,1)),3.8);gl_FragColor=vec4(.5,.7,1.,i*.14);}`,
    side:THREE.FrontSide,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false
  })
));

scene.add(new THREE.AmbientLight(0x151c28, 1.8));
const dl = new THREE.DirectionalLight(0xffffff, 0.7); dl.position.set(4,3,4); scene.add(dl);

function ll2v(lat, lon, r = 1) {
  const phi = (90 - lat) * Math.PI / 180, theta = (lon + 180) * Math.PI / 180;
  return new THREE.Vector3(-r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta));
}

const NODES = [
  { id:'bucuresti', name:'București (Sector 1)', lat:44.468, lon:26.083, isMain:true },
  { id:'cluj', name:'Cluj-Napoca', lat:46.770, lon:23.590 },
  { id:'timisoara', name:'Timișoara', lat:45.750, lon:21.230 },
  { id:'iasi', name:'Iași', lat:47.160, lon:27.590 },
  { id:'constanta', name:'Constanța', lat:44.180, lon:28.650 },
  { id:'chisinau', name:'Chișinău (UTM)', lat:47.005, lon:28.860, isIntl:true },
];

let selectedId = 'bucuresti';

// ─── NODURI LA SOL (BULINE INTERACTIVE) ──────────────────────────────
const nodeObjects = {};
const hitTargets = [];

NODES.forEach(n => {
  const pos = ll2v(n.lat, n.lon, 1.004);

  const dot = new THREE.Mesh(
    new THREE.SphereGeometry(n.isMain ? 0.015 : 0.011, 16, 16),
    new THREE.MeshBasicMaterial({ color:0xffffff, blending:THREE.AdditiveBlending })
  );
  dot.position.copy(pos);
  globeGroup.add(dot);

  const ringMat = new THREE.MeshBasicMaterial({ color:0xffffff, side:THREE.DoubleSide, transparent:true, opacity:0.4, blending:THREE.AdditiveBlending });
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.012, 0.018, 32), ringMat);
  ring.position.copy(pos.clone().multiplyScalar(1.003));
  ring.lookAt(pos.clone().multiplyScalar(3));
  globeGroup.add(ring);

  // Invisible Hit Sphere
  const hitGeo = new THREE.SphereGeometry(0.038, 8, 8);
  const hitMat = new THREE.MeshBasicMaterial({ visible:false });
  const hitMesh = new THREE.Mesh(hitGeo, hitMat);
  hitMesh.position.copy(pos);
  hitMesh.userData = { id: n.id, name: n.name };
  globeGroup.add(hitMesh);
  hitTargets.push(hitMesh);

  nodeObjects[n.id] = { pos, dot, ring, ringMat, node:n };
});

// ─── SATELIT CAD & ORBITĂ ─────────────────────────────────────────────
const satGroup = new THREE.Group();
const satBody = new THREE.Mesh(new THREE.BoxGeometry(0.022, 0.014, 0.022), new THREE.MeshBasicMaterial({ color:0xd4af37 }));
satGroup.add(satBody);

const panelGeo = new THREE.BoxGeometry(0.048, 0.003, 0.015);
const panelMat = new THREE.MeshBasicMaterial({ color:0x334155 });
const lp = new THREE.Mesh(panelGeo, panelMat); lp.position.x = -0.036; satGroup.add(lp);
const rp = new THREE.Mesh(panelGeo, panelMat); rp.position.x = 0.036; satGroup.add(rp);

const orbitRadius = 1.46;
const orbitPts = [];
for (let i = 0; i <= 96; i++) {
  const th = (i / 96) * Math.PI * 2;
  orbitPts.push(new THREE.Vector3(Math.cos(th)*orbitRadius, Math.sin(th)*orbitRadius*0.8, Math.sin(th)*orbitRadius*0.5));
}
const orbitGeo = new THREE.BufferGeometry().setFromPoints(orbitPts);
globeGroup.add(new THREE.Line(orbitGeo, new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity:0.15 })));

globeGroup.add(satGroup);

// 1px Hairline Laser
const laserGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
const laserMat = new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity:0.85, blending:THREE.AdditiveBlending });
const laserLine = new THREE.Line(laserGeo, laserMat);
globeGroup.add(laserLine);

function selectNode(id) {
  selectedId = id;
}

// ─── RAYCASTER DIRECT PE BULINE ──────────────────────────────────────
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let isPointerDown = false;
let downPos = { x: 0, y: 0 };

canvas.addEventListener('pointerdown', e => {
  isPointerDown = true;
  downPos = { x: e.clientX, y: e.clientY };
});

canvas.addEventListener('pointerup', e => {
  const dist = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
  isPointerDown = false;
  if (dist < 6) {
    mouse.x = (e.clientX / innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);

    const intersects = raycaster.intersectObjects(hitTargets, false);
    if (intersects.length > 0) {
      const hitId = intersects[0].object.userData.id;
      selectNode(hitId);
    }
  }
});

canvas.addEventListener('pointermove', e => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  const intersects = raycaster.intersectObjects(hitTargets, false);
  if (intersects.length > 0) {
    canvas.style.cursor = 'pointer';
    tooltip.style.display = 'block';
    tooltip.style.left = `${e.clientX}px`;
    tooltip.style.top = `${e.clientY}px`;
    tooltip.textContent = `📍 ${intersects[0].object.userData.name}`;
  } else {
    canvas.style.cursor = isPointerDown ? 'grabbing' : 'grab';
    tooltip.style.display = 'none';
  }
});

// Drag & Zoom
let px = 0, py = 0;
canvas.addEventListener('mousedown', e => { px = e.clientX; py = e.clientY; });
window.addEventListener('mousemove', e => {
  if (!isPointerDown) return;
  const dx = e.clientX - px;
  const dy = e.clientY - py;
  if (Math.hypot(dx, dy) > 2) {
    globeGroup.rotation.y += dx * 0.005;
    globeGroup.rotation.x += dy * 0.004;
  }
  px = e.clientX; py = e.clientY;
});
canvas.addEventListener('wheel', e => {
  camera.position.z = Math.max(1.6, Math.min(5, camera.position.z + e.deltaY * 0.003));
  e.preventDefault();
}, { passive:false });

globeGroup.rotation.y = -0.42;

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  if (!isPointerDown) globeGroup.rotation.y += 0.0008;

  const angle = t * 0.05 + 0.4;
  const satPos = new THREE.Vector3(
    Math.cos(angle) * orbitRadius,
    Math.sin(angle) * orbitRadius * 0.8,
    Math.sin(angle) * orbitRadius * 0.5
  );
  satGroup.position.copy(satPos);
  satGroup.lookAt(0, 0, 0);

  const targetGround = nodeObjects[selectedId].pos;
  laserGeo.setFromPoints([satPos, targetGround]);

  Object.entries(nodeObjects).forEach(([id, obj]) => {
    const isSel = id === selectedId;
    const p = 0.5 + 0.5 * Math.sin(t * (isSel ? 3.0 : 1.2));
    obj.ring.scale.setScalar(0.95 + p * (isSel ? 0.6 : 0.15));
    obj.ringMat.opacity = isSel ? (0.8 - p * 0.3) : 0.2;
  });

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
